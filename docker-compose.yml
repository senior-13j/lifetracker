services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - lifetracker-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - lifetracker-kafka:/var/lib/kafka/data

  seed:
    build:
      context: .
      dockerfile: apps/seed/Dockerfile
    profiles: ["tools"]
    environment:
      MONGO_URI: mongodb://mongo:27017/lifetracker
    depends_on:
      mongo:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      AUTH_SERVICE_PORT: 4001
      MONGO_URI: mongodb://mongo:27017/lifetracker
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-before-prod
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  habit-service:
    build:
      context: .
      dockerfile: apps/habit-service/Dockerfile
    environment:
      HABIT_SERVICE_PORT: 4002
      MONGO_URI: mongodb://mongo:27017/lifetracker
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-before-prod
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  realtime-service:
    build:
      context: .
      dockerfile: apps/realtime-service/Dockerfile
    ports:
      - "4003:4003"
    environment:
      REALTIME_SERVICE_PORT: 4003
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-before-prod
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  analytics-worker:
    build:
      context: .
      dockerfile: apps/analytics-worker/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/lifetracker
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-secret-change-before-prod
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      API_GATEWAY_PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4001
      HABIT_SERVICE_URL: http://habit-service:4002
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      - auth-service
      - habit-service

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_REALTIME_URL: http://localhost:4003
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
      - realtime-service

volumes:
  lifetracker-mongo:
  lifetracker-kafka:
